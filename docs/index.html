<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ripasso Medie</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="topbar">
  <a class="brand" href="#">Ripasso<small>scuola media</small></a>
  <a class="back" href="#" id="back" hidden>← Tutte le materie</a>
</nav>
<main id="app"></main>
<footer>Fatto in casa da genitori. Vuoi un quiz su un altro argomento? <a href="https://github.com/shalini27/ripasso-medie/issues/new/choose">Chiedilo qui</a>.</footer>

<script src="assets/elenco.js"></script>
<script>
(function () {
  const app = document.getElementById('app'), back = document.getElementById('back');
  const nome = Object.fromEntries(MATERIE);
  const el = (t, a, ...k) => { const e = document.createElement(t); for (const n in a || {}) n === 'class' ? e.className = a[n] : e.setAttribute(n, a[n]); e.append(...k); return e; };

  function home() {
    back.hidden = true;
    const tiles = el('div', { class: 'tiles' });
    for (const [id, label] of MATERIE) {
      const list = RIPASSO.filter(q => q.materia === id);
      const n = list.length;
      const t = el('a', { class: 'tile' + (n ? '' : ' vuota'), href: '#' + id, 'data-materia': id },
        el('h3', {}, label),
        el('div', { class: 'n' }, el('b', {}, String(n)), n === 1 ? '1 quiz' : n ? n + ' quiz' : 'ancora niente'));
      if (n) t.title = 'Ultimo: ' + list[0].titolo;
      tiles.append(t);
    }
    app.replaceChildren(
      el('header', { class: 'hero' },
        el('h1', {}, 'Cosa ripassiamo oggi?'),
        el('p', {}, 'Scegli una materia. Dentro trovi i quiz e le guide di ripasso per esercitarti.')),
      tiles);
  }

  function materia(id) {
    back.hidden = false;
    const list = RIPASSO.filter(q => q.materia === id);
    const head = el('header', { class: 'subhead', 'data-materia': id },
      el('span', { class: 'materia' }, nome[id]),
      el('h1', {}, nome[id]),
      el('p', {}, list.length ? `${list.length} ${list.length === 1 ? 'esercitazione' : 'esercitazioni'}, la più recente in alto.` : 'Nessun quiz ancora per questa materia.'));
    const rows = el('div', { class: 'rows', 'data-materia': id });
    list.forEach((q, k) => {
      rows.append(el('a', { class: 'row', href: 'quiz/' + q.file },
        el('div', { class: 'num' }, String(list.length - k)),
        el('div', {}, el('h3', {}, q.titolo),
          el('div', { class: 'sub' }, [q.classe && q.classe + ' media', q.argomento, q.domande && q.domande + ' domande'].filter(Boolean).join(' · '))),
        el('span', { class: 'kind' }, q.tipo || 'quiz')));
    });
    if (!list.length) rows.append(el('div', { class: 'empty' }, el('b', {}, 'In arrivo'), 'Appena è pronta un’esercitazione, compare qui.'));
    app.replaceChildren(head, rows);
    window.scrollTo(0, 0);
  }

  function route() { const id = location.hash.slice(1); nome[id] ? materia(id) : home(); }
  addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
