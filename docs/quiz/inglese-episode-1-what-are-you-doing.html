<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Episode 1 – What are you doing this afternoon?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#D6EBF8; --sky2:#BFDDF2; --cloud:#FFFFFF; --ink:#16325C; --ink2:#4A6382;
  --sun:#FFC83D; --sun2:#F2A900; --rain:#2F7FD6; --rain2:#1E62AD; --grass:#3BA55D; --grass2:#DDF4E4;
  --warn:#E5484D; --warn2:#FDE2E3; --line:#A9CBE6; --mute:#EEF5FB;
  --shadow:0 6px 0 var(--sky2);
  --r:18px; --rs:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky:#0F1E36; --sky2:#0A1526; --cloud:#182B49; --ink:#EAF3FC; --ink2:#A9BDD6;
    --sun:#FFC83D; --sun2:#FFD65C; --rain:#5AA2F0; --rain2:#7FB8F5; --grass:#4CC070; --grass2:#1D3A2A;
    --warn:#F07A7E; --warn2:#4A2224; --line:#2A4466; --mute:#1F355A; --shadow:0 6px 0 var(--sky2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky:#0F1E36; --sky2:#0A1526; --cloud:#182B49; --ink:#EAF3FC; --ink2:#A9BDD6;
  --sun:#FFC83D; --sun2:#FFD65C; --rain:#5AA2F0; --rain2:#7FB8F5; --grass:#4CC070; --grass2:#1D3A2A;
  --warn:#F07A7E; --warn2:#4A2224; --line:#2A4466; --mute:#1F355A; --shadow:0 6px 0 var(--sky2);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky);z-index:10}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
a{color:var(--rain)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sky);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.2px}
.brand .sun{width:34px;height:34px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 6px rgba(255,200,61,.25);display:inline-block}
.stats{display:flex;gap:8px}
.chip{background:var(--cloud);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.chip span{color:var(--rain)}

/* cards */
.card{background:var(--cloud);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.card h2{margin:0 0 8px;font-size:21px;font-weight:900}
.card h3{margin:14px 0 6px;font-size:17px;font-weight:800}
.card p{margin:6px 0}
.small{font-size:14px;color:var(--ink2)}
.it{color:var(--ink2);font-style:italic;font-weight:600}

/* hero thermometer */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.15;font-weight:900}
.thermo{display:flex;gap:10px;align-items:stretch;height:200px}
.thermo .tube{width:34px;border-radius:17px;background:var(--mute);position:relative;overflow:hidden;border:3px solid var(--line)}
.thermo .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#3B7DD8,#59B7E8,#8DD2A0,#F8D44C,#F7A531,#E8513D);height:0;transition:height .8s cubic-bezier(.2,.9,.3,1.2)}
.thermo .bulb{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--warn);border:3px solid var(--line)}
.thermo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink2)}
.thermo li.on{color:var(--ink)}
.bigpct{font-size:40px;font-weight:900;line-height:1}
.levelword{font-weight:900;color:var(--rain)}

/* mode tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--cloud);border:0;border-radius:var(--r);padding:16px 14px 14px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sky2)}
.tile .ico{font-size:30px;line-height:1;margin-bottom:8px;display:block}
.tile .name{font-weight:900;font-size:17px;display:block}
.tile .itn{font-size:13px;color:var(--ink2);font-weight:700;display:block}
.tile .done{margin-top:8px;height:6px;border-radius:3px;background:var(--mute);overflow:hidden}
.tile .done i{display:block;height:100%;background:var(--grass);width:0}
.tile.wide{grid-column:1/-1;background:var(--ink);color:var(--cloud)}
.tile.wide .itn{color:var(--sky)}
.tile.wide .done{background:rgba(255,255,255,.2)}
.tile.mist{background:var(--sun)}
.tile.mist .itn{color:var(--ink)}
:root[data-theme="dark"] .tile.mist, :root:not([data-theme="light"]) .tile.mist{color:#16325C}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tile.mist{color:#16325C} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:17px;cursor:pointer;background:var(--rain);color:#fff;box-shadow:0 5px 0 var(--rain2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rain2)}
.btn.sec{background:var(--mute);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sec:active{box-shadow:0 2px 0 var(--line)}
.btn.sun{background:var(--sun);color:#16325C;box-shadow:0 5px 0 var(--sun2)}
.btn.ok{background:var(--grass);box-shadow:0 5px 0 #2C7F47}
.btn.ghost{background:transparent;box-shadow:none;color:var(--rain);padding:8px 10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* question area */
.qbar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.qbar .prog{flex:1;height:10px;border-radius:5px;background:var(--cloud);overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.qbar .prog i{display:block;height:100%;background:var(--rain);width:0;transition:width .3s}
.qbar b{font-size:14px;white-space:nowrap}
.instr{display:inline-block;background:var(--sun);color:#16325C;font-weight:900;border-radius:8px;padding:3px 10px;font-size:14px;margin-bottom:10px}
.qtext{font-size:22px;font-weight:800;line-height:1.35;margin:6px 0 14px}
.qtext .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--rain);margin:0 4px;text-align:center;color:var(--rain)}
.qtext .hintv{color:var(--ink2);font-weight:700;font-style:italic}
.qtext.emo{font-size:64px;text-align:center;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--mute);border:3px solid transparent;border-radius:14px;padding:13px 16px;font-weight:800;font-size:18px;cursor:pointer}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--rain)}
.opt.right{border-color:var(--grass);background:var(--grass2)}
.opt.wrong{border-color:var(--warn);background:var(--warn2)}
.ansin{width:100%;border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:19px;font-weight:700;background:var(--cloud);outline:none}
.ansin:focus{border-color:var(--rain)}
.ansin.right{border-color:var(--grass);background:var(--grass2)}
.ansin.wrong{border-color:var(--warn);background:var(--warn2)}
textarea.ansin{min-height:170px;resize:vertical;line-height:1.5}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;animation:pop .25s cubic-bezier(.2,.9,.3,1.3)}
.fb.ok{background:var(--grass2);border-left:6px solid var(--grass)}
.fb.no{background:var(--warn2);border-left:6px solid var(--warn)}
.fb.hint{background:var(--mute);border-left:6px solid var(--sun)}
.fb .why{display:block;font-weight:600;margin-top:4px;color:var(--ink2)}
.fb .ans{display:block;margin-top:4px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.passage{background:var(--mute);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.55;margin-bottom:12px;max-height:260px;overflow:auto;white-space:pre-line}
.passage b{color:var(--rain)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tfrow .opt{text-align:center;font-size:20px}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:6px 0 6px 30px;position:relative;font-weight:700}
.checks li::before{content:"○";position:absolute;left:4px;color:var(--ink2)}
.checks li.ok::before{content:"✔";color:var(--grass)}
.checks li.no::before{content:"✘";color:var(--warn)}
.tips{background:var(--mute);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-size:15px}
.tips b{display:block;margin-bottom:4px}
.wc{font-size:14px;color:var(--ink2);text-align:right;margin-top:4px}
.model{white-space:pre-line;background:var(--grass2);border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:600}
.ai{white-space:pre-wrap;background:var(--mute);border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:600;line-height:1.5}

/* summary */
.score{font-size:46px;font-weight:900;line-height:1}
.stars{font-size:30px;letter-spacing:4px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf i{position:absolute;top:-20px;font-size:22px;animation:fall 1.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}

/* learn */
details{background:var(--cloud);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;padding:0 16px}
summary{cursor:pointer;font-weight:900;font-size:18px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;color:var(--rain)}
details[open] summary::after{content:"–"}
details .body{padding:0 0 16px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--ink2);font-weight:800}
.tbl{overflow-x:auto}
.ex{background:var(--mute);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:700}
.ex i{color:var(--ink2);font-weight:600}
.pill{display:inline-block;background:var(--mute);border-radius:999px;padding:3px 10px;margin:3px 4px 3px 0;font-weight:800;font-size:14px}
.tempscale{display:flex;justify-content:space-between;background:linear-gradient(90deg,#3B7DD8,#59B7E8,#8DD2A0,#F8D44C,#F7A531,#E8513D);border-radius:999px;padding:8px 14px;color:#fff;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.45);font-size:14px;margin:8px 0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--cloud);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 0 var(--sky2);z-index:20}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink2);padding:4px 10px;border-radius:12px;cursor:pointer}
.tab .i{font-size:22px}
.tab.on{color:var(--rain);background:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--warn)}
.listbtn{display:block;width:100%;text-align:left;background:var(--cloud);border:0;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;font-weight:800;font-size:17px;cursor:pointer}
.listbtn small{display:block;font-weight:700;color:var(--ink2);font-size:14px}
.listbtn.done{border-left:6px solid var(--grass)}
.listbtn.redo{border-left:6px solid var(--sun)}
@media (max-width:420px){ .hero{grid-template-columns:1fr} .thermo{height:150px} .qtext{font-size:20px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="sun"></span>Episode 1</div>
    <div class="stats"><div class="chip">⭐ <span id="xp">0</span> XP</div><div class="chip">🔥 <span id="streak">0</span></div></div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs">
  <button class="tab on" data-v="home"><span class="i">🏠</span>Home</button>
  <button class="tab" data-v="learn"><span class="i">📖</span>Learn</button>
  <button class="tab" data-v="mistakes"><span class="i">🔁</span>Mistakes</button>
  <button class="tab" data-v="exam"><span class="i">🏆</span>Exam</button>
</nav>
<div class="conf" id="conf"></div>

<script>
/* ================= DATA ================= */
const MCQ = [
 ["Ryan always ___ early.",["is getting up","gets up"],1,"'always' = a habit → present simple."],
 ["Sam ___ at the moment.",["works","is working"],1,"'at the moment' = now → present continuous."],
 ["It rarely ___ in May.",["is raining","rains"],1,"'rarely' = a habit → present simple."],
 ["I often ___ tea.",["am drinking","drink"],1,"'often' = a habit → present simple."],
 ["Tim ___ to Grandma now.",["talks","is talking"],1,"'now' → present continuous."],
 ["They ___ fruit once a week.",["buy","are buying"],0,"'once a week' = a habit → present simple."],
 ["I never ___ home at night.",["walk","am walking"],0,"'never' = a habit → present simple."],
 ["Look! Lucy ___!",["sings","is singing"],1,"'Look!' = it's happening now → present continuous."],
 ["We ___ to Leeds this evening.",["drive","are driving"],1,"A plan for this evening → present continuous for the future."],
 ["Are we having a party ___ 4th May?",["on","in","at"],0,"on + day / date (on Sunday, on 4th May)."],
 ["My sisters are going to Vienna ___ week.",["next","on","in"],0,"next week / next month / next year – no preposition."],
 ["I'm going to the doctor's ___ 10 o'clock.",["at","on","in"],0,"at + time (at 10 o'clock, at the weekend)."],
 ["Rob isn't starting school ___ October.",["in","on","at"],0,"in + month / season / year (in October, in summer, in 2026)."],
 ["Where are you going ___ morning?",["tomorrow","next","on"],0,"tomorrow morning / this morning – no preposition."],
 ["It's -2°C in Calgary. It's ___.",["freezing","warm","hot"],0,"Below zero = freezing 🧊"],
 ["It's 36°C in Mumbai. It's ___.",["hot","cool","cold"],0,"36°C = hot 🔥"],
 ["It's 10°C in Milan. It's ___.",["cool","hot","freezing"],0,"10°C = cool. Scale: hot – warm – mild – cool – cold – freezing."],
 ["\"Would you like to play tennis with me?\" \"___\"",["Yes, I'd love to!","Yes, I do.","Yes, I like."],0,"Would you like to…? → Yes, I'd love to! / I'd love to, but I can't."],
 ["\"Are you doing anything on Saturday?\" \"___\"",["No, I'm not.","No, I don't.","No, I'm not doing."],0,"Are you doing…? → short answer with am/is/are: No, I'm not."],
 ["Sorry, I can't. I ___ for a test tomorrow.",["am studying","study","studying"],0,"A fixed plan for tomorrow → present continuous (am studying)."],
 ["It's cloudy, but it ___.",["isn't raining","doesn't rain","not raining"],0,"Right now → present continuous negative: it isn't raining."],
 ["It never ___ in August.",["snows","is snowing","snow"],0,"'never' + it → present simple with -s: snows."],
 ["___ Melina wearing her jeans now?",["Is","Does","Are"],0,"Present continuous question: Is + she/he/it + -ing?"],
 ["How often ___ Steve write letters?",["does","is","do"],0,"Present simple question with he/she/it → does."],
 ["We're ___ in the final on Saturday.",["playing","play","plays"],0,"are + -ing: We're playing."],
 ["What's the weather ___ in Mumbai?",["like","as","how"],0,"Fixed question: What's the weather like?"],
 ["24°C = twenty-four ___ Celsius.",["degrees","grades","temperatures"],0,"Temperature is in degrees (gradi)."],
 ["\"What time are you going?\" \"___\"",["We're going at 7 o'clock.","We go at 7 o'clock.","At 7 o'clock we going."],0,"Future plan → We're going at 7 o'clock."],
 ["OK, let's ___ at the park.",["meet","meeting","to meet"],0,"Let's + base verb: Let's meet."],
 ["Sophie ___ to St Mark's school every day.",["goes","is going","go"],0,"'every day' = a habit → goes."],
 ["Dad ___ at the moment.",["is cooking","cooks","cook"],0,"'at the moment' → present continuous."],
 ["They ___ P.E. once a week.",["do","are doing","does"],0,"'once a week' = a habit; they → do."],
 ["Lily ___ early this morning.",["isn't getting up","doesn't get up","not get up"],0,"'this morning' (now) → present continuous negative."],
 ["Erica ___ basketball every Friday.",["plays","is playing","play"],0,"'every Friday' = a habit → plays."],
 ["I'd love to, but I ___.",["can't","don't","am not"],0,"I'd love to, but I can't. = Mi piacerebbe, ma non posso."],
 ["What ___ you doing on Sunday?",["are","do","is"],0,"Present continuous question: What are you doing…?"],
 ["It's sunny ___ it's hot in Sydney.",["and","but","or"],0,"Two similar ideas → and."],
 ["In Edinburgh it's snowing ___ it's windy.",["and","but","so"],0,"Two weather conditions together → and."],
 ["Izzie: What are you doing this afternoon? – Logan: ___",["I'm going to football practice.","I go to football practice.","I going to football practice."],0,"A plan for this afternoon → I'm going."],
 ["Dom: Are you going to the workshop? – Izzie: ___",["Yes, I am.","Yes, I go.","Yes, I'm."],0,"Short answer: Yes, I am. (never 'Yes, I'm.')"],
 ["Ruby: I can't come. ___ football practice.",["I've got","I'm got","I has got"],0,"I've got = ho."],
 ["Logan: Sure, ___ interesting.",["sounds","it sound","sounding"],0,"sounds interesting / sounds stupid = sembra interessante / stupido."],
 ["Evie: ___ you doing anything tomorrow?",["Are","Do","Is"],0,"Are you doing anything…? = Fai qualcosa…?"],
 ["Max: Would you like to go running in the park? – Evie: Oh yes, ___.",["I'd love to","I love","I'd like"],0,"I'd love to! = Mi piacerebbe molto!"],
 ["We're meeting at the station ___ 12.45 p.m.",["at","on","in"],0,"at + time."],
 ["What ___ the weather like in Madrid?",["'s","does","are"],0,"What's the weather like? (What is…)"],
 ["It's never warm and sunny here. It ___ rains!",["always","never","now"],0,"always = sempre (habit → rains)."],
 ["I hope it's sunny ___ warm in Madrid!",["and","or","but"],0,"sunny and warm."],
 ["Izzie: See you there, Dom! – Dom: ___",["See you!","I see you.","You see."],0,"See you! = Ci vediamo!"],
 ["\"What time are they leaving?\" \"___\"",["At half past five.","On half past five.","In half past five."],0,"at + time: at half past five (5.30)."],
];
const GAP = [
 // present simple / continuous
 ["It never ___ (snow) in August.",["snows"],"'never' = habit → it snows."],
 ["We always ___ (finish) work at 2 o'clock.",["finish"],"'always' = habit → present simple."],
 ["I ___ (have) a shower at the moment.",["am having","'m having"],"'at the moment' → am having."],
 ["Lily ___ (not get up) early this morning.",["isn't getting up","is not getting up","'s not getting up"],"'this morning' + now → isn't getting up."],
 ["They ___ (not phone) us very often!",["don't phone","do not phone"],"'very often' = habit → don't phone."],
 ["How often ___ (Steve / write) letters?",["does steve write"],"Habit question with he → does Steve write."],
 ["___ (Melina / wear) her jeans now?",["is melina wearing"],"'now' → Is Melina wearing…?"],
 ["Hi, Jim. How ___ (it / go)?",["is it going","'s it going"],"How's it going? = Come va?"],
 ["Terrible! It ___ (rain) right now!",["is raining","'s raining"],"'right now' → is raining."],
 ["It always ___ (rain) on Saturdays.",["rains"],"'always' = habit → rains."],
 ["It ___ (not rain) here at the moment. It's warm.",["isn't raining","is not raining","'s not raining"],"'at the moment' → isn't raining."],
 ["I ___ (sit) on the balcony now.",["am sitting","'m sitting"],"sit → sitting (double t)."],
 ["I ___ (study) History at the moment.",["am studying","'m studying"],"study → studying (keep the y)."],
 ["You're crazy! I never ___ (study) at the weekend.",["study"],"'never' = habit → present simple."],
 ["You ___ (not have) tests very often at your school.",["don't have","do not have"],"'very often' = habit → don't have."],
 ["How often ___ (you / have) tests?",["do you have"],"Habit question with you → do you have."],
 ["I ___ (pack) my bag at the moment.",["am packing","'m packing"],"'at the moment' → am packing."],
 ["It's terrible here – it ___ (rain) and it's really cold!",["is raining","'s raining"],"Now → is raining."],
 ["This evening, I ___ (go) to the summer party at my school.",["am going","'m going"],"A plan for this evening → am going."],
 ["We always ___ (have) a barbecue at the end of the school year.",["have"],"'always' = habit → have."],
 ["Dad usually ___ (help) with the food.",["helps"],"'usually' + Dad (he) → helps."],
 ["I ___ (meet) all my friends at 5 p.m. today.",["am meeting","'m meeting"],"A fixed plan → am meeting."],
 ["I'm rubbish at bowling and I never ___ (win).",["win"],"'never' = habit → win."],

/* ================= HELPERS ================= */
function norm(s){
  s=(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-");
  s=s.replace(/\blet's\b/g,"lets");
  s=s.replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not");
  s=s.replace(/\bi'm\b/g,"i am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'d\b/g," would").replace(/'ll\b/g," will").replace(/'ve\b/g," have");
  s=s.replace(/\bp\.e\.?/g,"pe").replace(/\ba\.m\.?/g,"am").replace(/\bp\.m\.?/g,"pm");
  s=s.replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();
  return s;
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function checkText(input,answers,q){
  const u=norm(input); if(!u) return {ok:false,close:false};
  if(q&&q.includes("___")){ // also accept "subject + answer" or the whole sentence
    const pre=norm(q.split("___")[0].replace(/\([^)]*\)/g,"")).split(" ").filter(Boolean);
    const extra=[];
    for(const a of answers){ for(let k=1;k<=3&&k<=pre.length;k++) extra.push(pre.slice(-k).join(" ")+" "+norm(a)); extra.push(norm(q.replace("___",a).replace(/\([^)]*\)/g,""))); }
    answers=answers.concat(extra);
  }
  for(const a of answers){ const n=norm(a); if(u===n) return {ok:true}; }
  for(const a of answers){ const n=norm(a); if(lev(u,n)<=Math.max(1,Math.floor(n.length/12))) return {ok:false,close:true}; }
  return {ok:false,close:false};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function blankify(q){ return esc(q).replace(/___/g,'<span class="blank">&nbsp;</span>').replace(/\(([^)]+)\)/g,'<span class="hintv">($1)</span>'); }
function confetti(){ const c=document.getElementById("conf"); const em=["⭐","🌟","☀️","🎉","✨"]; for(let i=0;i<18;i++){const s=document.createElement("i");s.textContent=em[i%em.length];s.style.left=Math.random()*100+"%";s.style.animationDelay=(Math.random()*.3)+"s";c.appendChild(s);setTimeout(()=>s.remove(),1700);} }
function record(id,ok,xp){ if(ok){S.ok[id]=(S.ok[id]||0)+1; delete S.bad[id]; S.xp+=xp; S.streak++; if(S.streak>S.best)S.best=S.streak;} else {S.bad[id]=(S.bad[id]||0)+1; S.streak=0;} save(); }
function masteryPct(){ const total=ITEMS.length+TF.reduce((n,p)=>n+p.items.length,0)+WRITE.length; let done=Object.keys(S.ok).length; return Math.round(100*done/total); }
function tempWord(p){ return p<10?"freezing":p<25?"cold":p<45?"cool":p<65?"mild":p<85?"warm":"hot"; }

/* ---- generic runner for mcq / gap / tr ---- */
function run(cfg){
  const items=cfg.items; let i=0, right=0, hinted=false, results=[];
  const onDone=cfg.onDone;
  function step(){
    if(i>=items.length){ return summary(); }
    const it=items[i]; hinted=false;
    const instr=it.t==="mcq"?"Choose the correct option":it.t==="gap"?"Complete the sentence":it.instr;
    const emo=/^[^\w\s]/.test(it.q)&&it.t==="gap";
    app.innerHTML=`<div class="qbar"><button class="btn ghost" id="quit">✕</button><div class="prog"><i style="width:${100*i/items.length}%"></i></div><b>${i+1}/${items.length}</b>${cfg.timerEl||""}</div>
    <section class="card">
      <span class="instr">${esc(instr)}</span>
      <div class="qtext${emo?" emo":""}">${it.t==="tr"?esc(it.q):blankify(it.q)}</div>
      <div id="zone"></div>
      <div id="fb"></div>
      <div class="row between" style="margin-top:14px"><button class="btn ghost" id="hint">💡 Hint</button><div class="row"><button class="btn" id="check">Check</button><button class="btn ok" id="next" style="display:none">Next ➜</button></div></div>
    </section>`;
    document.getElementById("quit").onclick=()=>{ if(confirm("Stop this round?")) go("home"); };
    const zone=document.getElementById("zone"), fb=document.getElementById("fb"), bC=document.getElementById("check"), bN=document.getElementById("next"), bH=document.getElementById("hint");
    let sel=-1, answered=false;
    if(it.t==="mcq"){
      zone.innerHTML=`<div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
      zone.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(answered)return; sel=+b.dataset.k; zone.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",+x.dataset.k===sel)); });
    } else {
      zone.innerHTML=`<input class="ansin" id="ans" autocomplete="off" autocapitalize="${it.t==="tr"?"sentences":"off"}" spellcheck="false" placeholder="${it.t==="tr"?"Type the new sentence…":"Type here…"}">`;
      const inp=document.getElementById("ans"); inp.focus(); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ answered?bN.click():bC.click(); } });
    }
    bH.onclick=()=>{ hinted=true; fb.innerHTML=`<div class="fb hint">💡 ${esc(it.why)}</div>`; };
    bC.onclick=()=>{
      if(answered) return;
      let ok=false, close=false, user="";
      if(it.t==="mcq"){ if(sel<0) return; ok=sel===it.a; zone.querySelectorAll(".opt").forEach(x=>{const k=+x.dataset.k; if(k===it.a)x.classList.add("right"); else if(k===sel)x.classList.add("wrong");}); }
      else { const inp=document.getElementById("ans"); user=inp.value; if(!user.trim()) return; const r=checkText(user,it.a,it.t==="gap"?it.q:null); ok=r.ok; close=r.close; inp.classList.add(ok?"right":"wrong"); inp.readOnly=true; }
      answered=true;
      const gain=ok?(hinted?Math.ceil(it.xp/2):it.xp):0;
      const best=it.t==="mcq"?it.opts[it.a]:it.a[0];
      if(ok){ right++; fb.innerHTML=`<div class="fb ok">✔ Correct! +${gain} XP${hinted?" (hint used)":""}<span class="why">${esc(it.why)}</span></div>`; confetti(); }
      else { fb.innerHTML=`<div class="fb no">${close?"✘ Almost! Check your spelling.":"✘ Not quite."}<span class="ans">Correct answer: <b>${esc(best)}</b></span><span class="why">${esc(it.why)}</span></div>`; }
      if(!cfg.noRecord) record(it.id,ok,gain);
      results.push({it,ok,user});
      bC.style.display="none"; bN.style.display=""; bN.focus();
    };
    bN.onclick=()=>{ i++; step(); };
  }
  function summary(){
    if(onDone) return onDone(results);
    const pct=Math.round(100*right/items.length); const stars="★".repeat(Math.round(pct/20))+"☆".repeat(5-Math.round(pct/20));
    const wrong=results.filter(r=>!r.ok);
    app.innerHTML=`<section class="card" style="text-align:center"><h2>${cfg.title} – round finished</h2><div class="score">${right}/${items.length}</div><div class="stars">${stars}</div>
    <p>${pct===100?"Perfect! You're on fire! 🔥":pct>=80?"Great job! Nearly perfect. 😎":pct>=60?"Good! Practise the wrong ones again. 🙂":"Keep going – read the hints and try again. 💪"}</p>
    <div class="row" style="justify-content:center;margin-top:10px">${wrong.length?`<button class="btn sun" id="again">Retry the ${wrong.length} wrong</button>`:""}<button class="btn" id="more">Another round</button><button class="btn sec" id="hm">Home</button></div></section>
    ${wrong.length?`<section class="card"><h2>Look again</h2>${wrong.map(r=>`<div class="ex">${esc(r.it.q)}<br>${r.user?`<i>You wrote: ${esc(r.user)}</i><br>`:""}✔ ${esc(r.it.t==="mcq"?r.it.opts[r.it.a]:r.it.a[0])}<br><i>${esc(r.it.why)}</i></div>`).join("")}</section>`:""}`;
    if(wrong.length) document.getElementById("again").onclick=()=>go("run",{items:wrong.map(r=>r.it),title:cfg.title});
    document.getElementById("more").onclick=()=>{ const m=items[0].mode; const its=MODES[m].items(); go("run",{items:shuffle(its).slice(0,10),title:cfg.title}); };

  }

}

/* ---- true / false ---- */
function tfList(){
  app.innerHTML=`<section class="card"><h2>✅ True or false</h2><p class="it">Vero o falso – e correggi le frasi false</p><p>Read the text, decide if each sentence is true or false, then <b>write the correct sentence</b> for the false ones (like in the test!).</p></section>
  ${TF.map(p=>{const d=p.items.filter((it,i)=>S.ok[p.id+"_"+i]).length; return `<button class="listbtn ${d===p.items.length?"done":d?"redo":""}" data-id="${p.id}">${esc(p.title)}<small>${p.items.length} sentences · ${d} correct so far</small></button>`;}).join("")}`;
  app.querySelectorAll(".listbtn").forEach(b=>b.onclick=()=>runTF(TF.find(p=>p.id===b.dataset.id)));
}
function runTF(p,opts){
  opts=opts||{}; let i=0, right=0, fixes=0, results=[];
  function step(){
    if(i>=p.items.length) return done();
    const it=p.items[i]; const [s,truth,fix,keys]=it;
    app.innerHTML=`<div class="qbar"><button class="btn ghost" id="quit">✕</button><div class="prog"><i style="width:${100*i/p.items.length}%"></i></div><b>${i+1}/${p.items.length}</b>${opts.timerEl||""}</div>
    <section class="card"><span class="instr">Read the text</span><h2 style="font-size:18px">${esc(p.title)}</h2><div class="passage">${esc(p.text)}</div>
    <span class="instr">True or false?</span><div class="qtext">${esc(s)}</div>
    <div class="tfrow"><button class="opt" data-v="true">TRUE ✔</button><button class="opt" data-v="false">FALSE ✘</button></div>
    <div id="fb"></div><div id="fixzone"></div>
    <div class="row end" style="margin-top:12px"><button class="btn ok" id="next" style="display:none">Next ➜</button></div></section>`;
    document.getElementById("quit").onclick=()=>{ if(confirm("Stop this exercise?")) go("home"); };
    const fb=document.getElementById("fb"), fz=document.getElementById("fixzone"), bN=document.getElementById("next");
    let answered=false, tfOk=false;
    app.querySelectorAll(".tfrow .opt").forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true; const v=b.dataset.v==="true"; tfOk=v===truth;
      app.querySelectorAll(".tfrow .opt").forEach(x=>{const xv=x.dataset.v==="true"; if(xv===truth)x.classList.add("right"); else if(xv===v)x.classList.add("wrong");});
      if(tfOk){ right++; fb.innerHTML=`<div class="fb ok">✔ Correct! +5 XP${truth?"":`<span class="why">It's false. Now correct it!</span>`}</div>`; }
      else { fb.innerHTML=`<div class="fb no">✘ No, it's ${truth?"TRUE":"FALSE"}.${truth?"":`<span class="ans">Correct sentence: <b>${esc(fix)}</b></span>`}</div>`; }
      if(!truth&&tfOk){
        fz.innerHTML=`<span class="instr">Write the correct sentence</span><input class="ansin" id="fixin" autocomplete="off" placeholder="Correct the sentence…"><div class="row end" style="margin-top:8px"><button class="btn" id="fixbtn">Check</button></div>`;
        const inp=document.getElementById("fixin"); inp.focus();
        const doFix=()=>{ const u=inp.value.trim(); if(!u)return; const low=norm(u); const ok=keys.every(k=>low.includes(norm(k)))&&u.split(/\s+/).length>=3; inp.readOnly=true; inp.classList.add(ok?"right":"wrong");
          document.getElementById("fixbtn").disabled=true;
          if(ok){ fixes++; fz.insertAdjacentHTML("beforeend",`<div class="fb ok">✔ Good correction! +5 XP<span class="ans">Model: ${esc(fix)}</span></div>`); confetti(); }
          else fz.insertAdjacentHTML("beforeend",`<div class="fb no">✘ Not quite.<span class="ans">Model answer: <b>${esc(fix)}</b></span></div>`);
          if(!opts.noRecord) record(p.id+"_"+i,ok,5);
          results.push({s,ok:true,fixOk:ok,user:u,fix}); bN.style.display=""; bN.focus(); };
        document.getElementById("fixbtn").onclick=doFix; inp.addEventListener("keydown",e=>{if(e.key==="Enter"){ if(inp.readOnly) bN.click(); else doFix(); }});
      } else {
        if(!opts.noRecord) record(p.id+"_"+i,tfOk,5);
        results.push({s,ok:tfOk,fix:truth?null:fix}); if(tfOk)confetti(); bN.style.display=""; bN.focus();
      }
    });
    bN.onclick=()=>{i++;step();};
  }
  function done(){
    if(opts.onDone) return opts.onDone(results);
    const nF=p.items.filter(x=>!x[1]).length;
    app.innerHTML=`<section class="card" style="text-align:center"><h2>${esc(p.title)}</h2><div class="score">${right}/${p.items.length}</div><p>True/false correct: ${right} · Corrections right: ${fixes}/${nF}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Try again</button><button class="btn sec" id="list">Other texts</button></div></section>`;
    document.getElementById("again").onclick=()=>runTF(p); document.getElementById("list").onclick=()=>go("tfList");
  }
  step();
}

/* ---- writing ---- */
function writeList(){
  app.innerHTML=`<section class="card"><h2>💬 Write a message</h2><p class="it">Produzione scritta – un messaggio di testo</p><p>Write the message, then tap <b>Check</b>: the checklist shows what's missing. ${sampleFn?"Then ask the <b>AI teacher</b> to correct your grammar.":""}</p></section>
  ${WRITE.map(w=>`<button class="listbtn ${S.ok[w.id]?"done":S.writes[w.id]?"redo":""}" data-id="${w.id}">${esc(w.title)}<small>${S.ok[w.id]?"Completed ✔":S.writes[w.id]?"Started – continue":"Not started"}</small></button>`).join("")}`;
  app.querySelectorAll(".listbtn").forEach(b=>b.onclick=()=>runWrite(WRITE.find(w=>w.id===b.dataset.id)));
}
function runWrite(w,opts){
  opts=opts||{};
  app.innerHTML=`<div class="qbar"><button class="btn ghost" id="quit">✕</button><b>${esc(w.title)}</b>${opts.timerEl||""}</div>
  <section class="card"><span class="instr">Write a text message</span><p style="font-weight:800;font-size:18px">${esc(w.task)}</p><p class="it">${esc(w.it)}</p>
  <div class="tips"><b>Useful phrases</b>Hi! · Are you doing anything on…? · What are you doing…? · Would you like to…? · Yes, I'd love to! · I'd love to, but I can't. I'm… · What time are you going? · Let's meet at… · Is … o'clock OK? · See you there!</div>
  <textarea class="ansin" id="txt" placeholder="Write at least ${w.min} words…">${esc(S.writes[w.id]||"")}</textarea><div class="wc" id="wc">0 words</div>
  <ul class="checks" id="cl">${w.checks.map(c=>`<li>${esc(c[0])}</li>`).join("")}<li id="lenc">At least ${w.min} words</li></ul>
  <div class="row"><button class="btn" id="chk">Check my message</button>${sampleFn?`<button class="btn sun" id="ai">🧑‍🏫 AI teacher, correct me</button>`:""}<button class="btn sec" id="model">Show a model answer</button></div>
  <div id="out"></div><div id="aiout"></div></section>`;
  document.getElementById("quit").onclick=()=>{ saveDraft(); opts.onQuit?opts.onQuit():go("writeList"); };
  const ta=document.getElementById("txt"), wc=document.getElementById("wc"), out=document.getElementById("out"), aiout=document.getElementById("aiout");
  const words=()=>ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
  const upd=()=>{wc.textContent=words()+" words";}; upd(); ta.addEventListener("input",upd);
  function saveDraft(){ S.writes[w.id]=ta.value; save(); }
  function runChecks(){
    const t=ta.value; let pass=0; const lis=document.querySelectorAll("#cl li");
    w.checks.forEach((c,k)=>{ const ok=typeof c[1]==="function"?c[1](t):c[1].test(t); lis[k].className=ok?"ok":"no"; if(ok)pass++; });
    const lenOk=words()>=w.min; document.getElementById("lenc").className=lenOk?"ok":"no";
    return {pass,total:w.checks.length,lenOk};
  }
  document.getElementById("chk").onclick=()=>{
    if(!ta.value.trim())return; saveDraft(); const r=runChecks(); const all=r.pass===r.total&&r.lenOk;
    const xp=all?30:Math.round(30*r.pass/r.total*0.5);
    if(!opts.noRecord){ if(all&&!S.ok[w.id]){ S.xp+=xp; } if(all){S.ok[w.id]=1; delete S.bad[w.id];} else S.bad[w.id]=1; save(); }
    out.innerHTML=all?`<div class="fb ok">✔ Your message has everything! +${xp} XP 🎉 ${sampleFn?"Now ask the AI teacher to check your grammar.":"Compare it with the model answer."}</div>`:`<div class="fb no">${r.pass}/${r.total} parts done. Look at the ✘ in the checklist and add what's missing.</div>`;
    if(all)confetti(); if(opts.onChecked) opts.onChecked(all,r);
  };
  document.getElementById("model").onclick=()=>{ out.insertAdjacentHTML("beforeend",`<div class="model"><b>Model answer</b>\n${esc(w.model)}</div>`); };
  const aib=document.getElementById("ai");
  if(aib) aib.onclick=async()=>{
    const t=ta.value.trim(); if(!t||!sampleFn)return; saveDraft(); aib.disabled=true; aiout.innerHTML=`<div class="ai">Thinking…</div>`;
    const prompt=`You are a friendly English teacher for a 12-year-old Italian student (A1-A2 level). The student is practising: present simple vs present continuous (also for future plans), weather vocabulary, and inviting / making arrangements (Would you like to…? I'd love to, but I can't. Let's meet at…).

TASK the student had to do: ${w.task}

STUDENT'S MESSAGE:
"""
${t}
"""

Reply in simple English (max 150 words). Format exactly:
1) ⭐ Score: X/5
2) ✅ What's good: one short sentence.
3) ✏️ Corrections: list each mistake as "wrong → correct" with a 5-10 word explanation (you may add a short Italian hint in brackets). If there are no mistakes, say "No mistakes!".
4) 📝 Corrected version: the full message, corrected.
Do not add anything else.`;
    try{ const {text}=await sampleFn(prompt,{modelTier:"default",onText:({text})=>{aiout.innerHTML=`<div class="ai">${esc(text)}</div>`;}}); aiout.innerHTML=`<div class="ai">${esc(text)}</div>`; }
    catch(e){ aiout.innerHTML=`<div class="fb no">${e&&e.code==="not_granted"?"AI teacher not allowed on this device. Compare with the model answer instead.":"The AI teacher isn't available right now. Compare with the model answer instead."}</div>`; }
    finally{ aib.disabled=false; }
  };
}

/* ---- exam simulation ---- */
function exam(){
  app.innerHTML=`<section class="card"><h2>🏆 Exam simulation</h2><p>A mixed test in the same four parts as the real one:</p>
  <ol><li><b>Manipolazione</b> (volgi al…) – 8 sentences to transform</li><li><b>Vero o falso</b> – one text, correct the false sentences</li><li><b>Produzione scritta</b> – one text message</li><li><b>Completamento di frasi</b> – 6 multiple choice + 8 open gaps</li></ol>
  <p>You have <b>30 minutes</b>. No hints. Good luck! 🍀</p><button class="btn block" id="start">Start the exam</button></section>`;
  document.getElementById("start").onclick=startExam;
}
function startExam(){
  const t0=Date.now(), limit=30*60; let timerInt; const res={}; let finished=false;
  const timerEl=`<span class="timer" id="tm">30:00</span>`;
  function tick(){ const el=document.getElementById("tm"); if(!el)return; const left=Math.max(0,limit-Math.floor((Date.now()-t0)/1000)); el.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0"); if(left===0){clearInterval(timerInt); finish(true);} }
  timerInt=setInterval(tick,500);
  const pickTr=()=>{ const kinds={}; ITEMS.filter(x=>x.t==="tr").forEach(x=>{(kinds[x.instr]=kinds[x.instr]||[]).push(x);}); const out=[]; shuffle(Object.keys(kinds)).forEach(k=>{ if(out.length<8) out.push(shuffle(kinds[k])[0]); }); return shuffle(out); };
  const part1=pickTr();
  const tfP=TF[Math.floor(Math.random()*TF.length)];
  const wr=WRITE[Math.floor(Math.random()*WRITE.length)];
  const part4=shuffle(ITEMS.filter(x=>x.t==="mcq")).slice(0,6).concat(shuffle(ITEMS.filter(x=>x.t==="gap")).slice(0,8));
  run({items:part1,title:"Part 1 – Manipolazione",timerEl,onDone:r=>{ res.tr=r;
    runTF(tfP,{timerEl,onDone:r2=>{ res.tf=r2;
      runWrite(wr,{timerEl,onChecked:(all,rr)=>{ res.w={all,r:rr}; setTimeout(()=>{ if(finished)return; run({items:part4,title:"Part 4 – Completamento",timerEl,onDone:r3=>{ res.c=r3; finish(false); }}); },1200); },onQuit:()=>finish(false)});
    }});
  }});
  function finish(timeUp){
    if(finished)return; finished=true; clearInterval(timerInt);
    const tr=res.tr||[], tf=res.tf||[], c=res.c||[], w=res.w;
    const s1=tr.filter(x=>x.ok).length;
    const n2=tf.length+tfP.items.filter(x=>!x[1]).length, s2=tf.filter(x=>x.ok).length+tf.filter(x=>x.fixOk).length;
    const s3=w?(w.all?6:Math.round(6*w.r.pass/w.r.total)):0;
    const s4=c.filter(x=>x.ok).length;
    const tot=s1+s2+s3+s4, max=8+n2+6+14; const pct=Math.round(100*tot/max);
    const grade=pct>=95?"10":pct>=85?"9":pct>=75?"8":pct>=65?"7":pct>=55?"6":"5";
    const secs=Math.floor((Date.now()-t0)/1000);
    app.innerHTML=`<section class="card" style="text-align:center"><h2>${timeUp?"⏰ Time's up!":"Exam finished!"}</h2><div class="score">${pct}%</div><p style="font-size:22px;font-weight:900">Grade: ${grade}</p><p class="small">Time: ${Math.floor(secs/60)} min ${secs%60} s</p>
    <div class="tbl"><table><tr><th>Part</th><th>Score</th></tr><tr><td>1 · Manipolazione</td><td>${s1}/8</td></tr><tr><td>2 · Vero o falso (${esc(tfP.title)})</td><td>${s2}/${n2}</td></tr><tr><td>3 · Produzione scritta</td><td>${s3}/6</td></tr><tr><td>4 · Completamento</td><td>${s4}/14</td></tr></table></div>
    <p>${pct>=85?"Excellent – you're ready! 🏆":pct>=65?"Good. Practise the parts with lower scores, then try again. 💪":"Study the Learn page, practise each mode, then try again. You can do it! 🌱"}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">New exam</button><button class="btn sec" id="hm">Home</button></div></section>`;
    document.getElementById("again").onclick=startExam; document.getElementById("hm").onclick=()=>go("home");
  }
}
